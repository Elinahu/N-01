      <text class="cls-19" transform="translate(79.41 430.62)"><tspan class="cls-22"><tspan x="0" y="0">File</tspan><tspan class="cls-2" x="34.24" y="0"> </tspan><tspan x="42.35" y="0">records</tspan><tspan class="cls-2" x="102.27" y="0"> </tspan><tspan x="110.38" y="0">indicate</tspan><tspan class="cls-25" x="178.87" y="0"> </tspan><tspan x="186.97" y="0">that</tspan><tspan class="cls-2" x="221.22" y="0"> </tspan><tspan x="229.32" y="0">the</tspan><tspan class="cls-2" x="255" y="0"> </tspan><tspan x="263.11" y="0">subject</tspan><tspan class="cls-2" x="323.04" y="0"> </tspan><tspan x="331.14" y="0">exhibited</tspan><tspan class="cls-2" x="408.19" y="0"> </tspan><tspan x="416.3" y="0">extreme</tspan><tspan class="cls-2" x="476.22" y="0"> </tspan><tspan x="484.33" y="0">physiological</tspan><tspan class="cls-25" x="595.61" y="0"> </tspan><tspan x="603.72" y="0">and </tspan></tspan><tspan class="cls-22"><tspan x="0" y="18.68">psychological</tspan><tspan class="cls-21" x="111.29" y="18.68"> </tspan><tspan x="122.93" y="18.68">breakdown</tspan><tspan class="cls-5" x="199.98" y="18.68"> </tspan><tspan x="211.63" y="18.68">when</tspan><tspan class="cls-21" x="245.87" y="18.68"> </tspan><tspan x="257.51" y="18.68">subjected</tspan><tspan class="cls-21" x="334.56" y="18.68"> </tspan><tspan x="346.21" y="18.68">to</tspan><tspan class="cls-21" x="363.33" y="18.68"> </tspan><tspan x="374.97" y="18.68">environmental</tspan><tspan class="cls-5" x="486.26" y="18.68"> </tspan><tspan x="497.91" y="18.68">stimulation</tspan><tspan class="cls-21" x="592.07" y="18.68"> </tspan><tspan x="603.72" y="18.68">and </tspan></tspan><tspan class="cls-22"><tspan x="0" y="37.37">deprivation.</tspan><tspan class="cls-27" x="102.73" y="37.37"> </tspan><tspan x="109.88" y="37.37">When</tspan><tspan class="cls-27" x="144.12" y="37.37"> </tspan><tspan x="151.28" y="37.37">placed</tspan><tspan class="cls-27" x="202.64" y="37.37"> </tspan><tspan x="209.8" y="37.37">in</tspan><tspan class="cls-27" x="226.92" y="37.37"> </tspan><tspan x="234.08" y="37.37">a</tspan><tspan class="cls-27" x="242.64" y="37.37"> </tspan><tspan x="249.79" y="37.37">completely</tspan><tspan class="cls-27" x="335.4" y="37.37"> </tspan><tspan x="342.56" y="37.37">white</tspan><tspan class="cls-27" x="385.36" y="37.37"> </tspan><tspan x="392.52" y="37.37">enclosed</tspan><tspan class="cls-27" x="461" y="37.37"> </tspan><tspan x="468.16" y="37.37">laboratory</tspan><tspan class="cls-27" x="553.76" y="37.37"> </tspan><tspan x="560.92" y="37.37">(sensory </tspan></tspan><tspan class="cls-22"><tspan x="0" y="56.05">deprivation</tspan><tspan class="cls-1" x="94.17" y="56.05"> </tspan><tspan x="107.04" y="56.05">environment),</tspan><tspan class="cls-17" x="218.32" y="56.05"> </tspan><tspan x="231.19" y="56.05">the</tspan><tspan class="cls-1" x="256.88" y="56.05"> </tspan><tspan x="269.75" y="56.05">subject</tspan><tspan class="cls-17" x="329.67" y="56.05"> </tspan><tspan x="342.54" y="56.05">rapidly</tspan><tspan class="cls-1" x="402.46" y="56.05"> </tspan><tspan x="415.34" y="56.05">displayed</tspan><tspan class="cls-17" x="492.38" y="56.05"> </tspan><tspan x="505.25" y="56.05">extreme</tspan><tspan class="cls-1" x="565.17" y="56.05"> </tspan><tspan x="578.05" y="56.05">mania, </tspan></tspan><tspan class="cls-22"><tspan x="0" y="74.74">accompanied by severe spasms and convulsions.</tspan></tspan><tspan class="cls-18"><tspan x="0" y="112.11">The</tspan><tspan class="cls-2" x="25.68" y="112.11"> </tspan><tspan x="33.79" y="112.11">subject</tspan><tspan class="cls-2" x="93.71" y="112.11"> </tspan><tspan x="101.82" y="112.11">developed</tspan><tspan class="cls-25" x="178.87" y="112.11"> </tspan><tspan x="186.97" y="112.11">a</tspan><tspan class="cls-2" x="195.53" y="112.11"> </tspan><tspan x="203.64" y="112.11">pathological</tspan><tspan class="cls-2" x="306.37" y="112.11"> </tspan><tspan x="314.48" y="112.11">interest</tspan><tspan class="cls-2" x="382.96" y="112.11"> </tspan><tspan x="391.07" y="112.11">in</tspan><tspan class="cls-2" x="408.19" y="112.11"> </tspan><tspan x="416.3" y="112.11">electronic</tspan><tspan class="cls-2" x="501.9" y="112.11"> </tspan><tspan x="510.01" y="112.11">screens,</tspan><tspan class="cls-25" x="578.49" y="112.11"> </tspan><tspan x="586.6" y="112.11">while </tspan></tspan><tspan class="cls-18"><tspan x="0" y="130.79">suffering</tspan><tspan class="cls-2" x="77.04" y="130.79"> </tspan><tspan x="85.15" y="130.79">severe</tspan><tspan class="cls-2" x="136.52" y="130.79"> </tspan><tspan x="144.62" y="130.79">physiological</tspan><tspan class="cls-2" x="255.91" y="130.79"> </tspan><tspan x="264.02" y="130.79">disruption</tspan><tspan class="cls-2" x="349.62" y="130.79"> </tspan><tspan x="357.73" y="130.79">(sleep</tspan><tspan class="cls-2" x="409.09" y="130.79"> </tspan><tspan x="417.2" y="130.79">reduced</tspan><tspan class="cls-2" x="477.12" y="130.79"> </tspan><tspan x="485.23" y="130.79">to</tspan><tspan class="cls-2" x="502.35" y="130.79"> </tspan><tspan x="510.46" y="130.79">2-3</tspan><tspan class="cls-2" x="536.14" y="130.79"> </tspan><tspan x="544.25" y="130.79">hours</tspan><tspan class="cls-2" x="587.05" y="130.79"> </tspan><tspan x="595.16" y="130.79">with </tspan></tspan><tspan class="cls-18"><tspan x="0" y="149.47">loss</tspan><tspan class="cls-3" x="34.24" y="149.47"> </tspan><tspan x="49.78" y="149.47">of</tspan><tspan class="cls-3" x="66.9" y="149.47"> </tspan><tspan x="82.45" y="149.47">appetite).</tspan><tspan class="cls-23" x="168.05" y="149.47"> </tspan><tspan x="183.59" y="149.47">Behaviorally</tspan><tspan class="cls-3" x="286.32" y="149.47"> </tspan><tspan x="301.86" y="149.47">passive,</tspan><tspan class="cls-3" x="370.34" y="149.47"> </tspan><tspan x="385.89" y="149.47">the</tspan><tspan class="cls-3" x="411.57" y="149.47"> </tspan><tspan x="427.11" y="149.47">subject</tspan><tspan class="cls-23" x="487.03" y="149.47"> </tspan><tspan x="502.57" y="149.47">rarely</tspan><tspan class="cls-3" x="553.94" y="149.47"> </tspan><tspan x="569.48" y="149.47">reacted </tspan></tspan><tspan class="cls-18"><tspan x="0" y="168.16">proactively</tspan><tspan class="cls-15" x="94.17" y="168.16"> </tspan><tspan x="104.59" y="168.16">and</tspan><tspan class="cls-15" x="130.27" y="168.16"> </tspan><tspan x="140.7" y="168.16">showed</tspan><tspan class="cls-15" x="192.06" y="168.16"> </tspan><tspan x="202.49" y="168.16">significant</tspan><tspan class="cls-15" x="296.65" y="168.16"> </tspan><tspan x="307.08" y="168.16">sluggishness</tspan><tspan class="cls-15" x="409.8" y="168.16"> </tspan><tspan x="420.23" y="168.16">to</tspan><tspan class="cls-28" x="437.35" y="168.16"> </tspan><tspan x="447.77" y="168.16">open-ended</tspan><tspan class="cls-15" x="533.38" y="168.16"> </tspan><tspan x="543.8" y="168.16">questions, </tspan></tspan><tspan class="cls-18"><tspan x="0" y="186.84">mostly unable to provide answers.</tspan></tspan></text>
