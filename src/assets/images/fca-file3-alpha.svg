      <text transform="translate(1194.6 374.31)">
        <tspan class="cls-26">
          <tspan class="cls-14" x="0" y="0">【</tspan>
          <tspan class="cls-22" x="14.63" y="0">Experimental Observation Summary</tspan>
          <tspan class="cls-14" x="272.07" y="0">】</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="35.12">Environmental Setup:</tspan>
          <tspan class="cls-33" x="223.8" y="35.12" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-61.42" y="51.08">A fully enclosed, four-walled white laboratory devoid of </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-32.17" y="67.04">any visual reference points (sensory deprivation </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="95.81" y="83">environment).</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="116.52">Observation Results:</tspan>
          <tspan class="cls-33" x="223.8" y="116.52" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-54.11" y="132.48">Upon being placed in this fully white environment, the </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-68.74" y="148.44">subject's physiological and psychological defenses rapidly </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-72.39" y="164.4">collapsed. The subject exhibited extreme mania, accompanied </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-65.08" y="180.37">by severe muscle spasms and involuntary convulsions. This </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-65.08" y="196.33">acute stress response, triggered by the absolute monotony </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-68.74" y="212.29">of the environment, indicates a severe cognitive breakdown </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-72.4" y="228.25">as the subject loses spatial perception and visual anchors.</tspan>
        </tspan>
      </text>
    </g>
