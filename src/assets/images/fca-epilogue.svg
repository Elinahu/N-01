    <text id="english-message" class="cls-11" transform="translate(264.43 178.55)"><tspan class="cls-8"><tspan x="0" y="0">In</tspan><tspan class="cls-5" x="39.59" y="0"> </tspan><tspan x="60.81" y="0">2126,</tspan><tspan class="cls-5" x="159.77" y="0"> </tspan><tspan x="180.99" y="0">humanity</tspan><tspan class="cls-5" x="339.34" y="0"> </tspan><tspan x="360.56" y="0">created</tspan><tspan class="cls-5" x="499.11" y="0"> </tspan><tspan x="520.33" y="0">a</tspan><tspan class="cls-19" x="540.12" y="0"> </tspan><tspan x="561.35" y="0">world</tspan><tspan class="cls-5" x="660.31" y="0"> </tspan><tspan x="681.53" y="0">of</tspan><tspan class="cls-5" x="721.12" y="0"> </tspan><tspan x="742.34" y="0">unprecedented</tspan><tspan class="cls-5" x="999.65" y="0"> </tspan><tspan x="1020.87" y="0">convenience,</tspan><tspan class="cls-5" x="1258.39" y="0"> </tspan><tspan x="1279.61" y="0">yet </tspan></tspan><tspan class="cls-8"><tspan x="0" y="48">unknowingly surrendered its power of choice to technology.</tspan></tspan><tspan class="cls-8" x="0" y="144">When</tspan><tspan class="cls-9" x="79.17" y="144"> </tspan><tspan class="cls-8" x="106.19" y="144">there</tspan><tspan class="cls-9" x="205.15" y="144"> </tspan><tspan class="cls-8" x="232.17" y="144">is</tspan><tspan class="cls-9" x="271.76" y="144"> </tspan><tspan class="cls-8" x="298.77" y="144">always</tspan><tspan class="cls-9" x="417.53" y="144"> </tspan><tspan class="cls-8" x="444.55" y="144">a</tspan><tspan class="cls-9" x="464.34" y="144"> </tspan><tspan class="cls-8" x="491.36" y="144">&quot;</tspan><tspan class="cls-10" x="511.15" y="144">next</tspan><tspan class="cls-8" x="590.32" y="144">&quot;</tspan><tspan class="cls-9" x="610.11" y="144"> </tspan><tspan class="cls-8" x="637.13" y="144">to</tspan><tspan class="cls-9" x="676.72" y="144"> </tspan><tspan class="cls-8" x="703.73" y="144">watch,</tspan><tspan class="cls-9" x="822.49" y="144"> </tspan><tspan class="cls-8" x="849.51" y="144">when</tspan><tspan class="cls-9" x="928.68" y="144"> </tspan><tspan class="cls-8" x="955.7" y="144">passive</tspan><tspan class="cls-9" x="1094.25" y="144"> </tspan><tspan class="cls-8" x="1121.26" y="144">consumption </tspan><tspan class="cls-8"><tspan x="0" y="192">gradually</tspan><tspan class="cls-1" x="178.14" y="192"> </tspan><tspan x="194.96" y="192">replaces</tspan><tspan class="cls-1" x="353.3" y="192"> </tspan><tspan x="370.13" y="192">active</tspan><tspan class="cls-1" x="488.88" y="192"> </tspan><tspan x="505.71" y="192">exploration,</tspan><tspan class="cls-1" x="743.22" y="192"> </tspan><tspan x="760.05" y="192">will</tspan><tspan class="cls-6" x="839.22" y="192"> </tspan><tspan x="856.04" y="192">we</tspan><tspan class="cls-1" x="895.63" y="192"> </tspan><tspan x="912.45" y="192">still</tspan><tspan class="cls-1" x="1011.42" y="192"> </tspan><tspan x="1028.24" y="192">remember</tspan><tspan class="cls-1" x="1186.58" y="192"> </tspan><tspan x="1203.41" y="192">what</tspan><tspan class="cls-1" x="1282.58" y="192"> </tspan><tspan x="1299.4" y="192">we </tspan></tspan><tspan class="cls-8"><tspan x="0" y="240">truly want?</tspan></tspan><tspan class="cls-8"><tspan x="0" y="336">N-01</tspan><tspan class="cls-4" x="79.17" y="336"> </tspan><tspan x="98.39" y="336">never</tspan><tspan class="cls-3" x="197.35" y="336"> </tspan><tspan x="216.57" y="336">truly</tspan><tspan class="cls-4" x="315.53" y="336"> </tspan><tspan x="334.75" y="336">took</tspan><tspan class="cls-16" x="413.92" y="336"> </tspan><tspan x="433.13" y="336">away</tspan><tspan class="cls-4" x="512.31" y="336"> </tspan><tspan x="531.52" y="336">our</tspan><tspan class="cls-4" x="590.9" y="336"> </tspan><tspan x="610.11" y="336">freedom.</tspan><tspan class="cls-4" x="768.46" y="336"> </tspan><tspan x="787.67" y="336">It</tspan><tspan class="cls-4" x="827.26" y="336"> </tspan><tspan x="846.47" y="336">simply</tspan><tspan class="cls-4" x="965.23" y="336"> </tspan><tspan x="984.45" y="336">made</tspan><tspan class="cls-16" x="1063.62" y="336"> </tspan><tspan x="1082.83" y="336">giving</tspan><tspan class="cls-4" x="1201.59" y="336"> </tspan><tspan x="1220.81" y="336">up</tspan><tspan class="cls-4" x="1260.39" y="336"> </tspan><tspan x="1279.61" y="336">in</tspan><tspan x="1319.19" y="336">-</tspan></tspan><tspan class="cls-8"><tspan x="0" y="384">dependent</tspan><tspan class="cls-2" x="178.14" y="384"> </tspan><tspan x="208.16" y="384">thought</tspan><tspan class="cls-2" x="346.71" y="384"> </tspan><tspan x="376.72" y="384">so</tspan><tspan class="cls-2" x="416.31" y="384"> </tspan><tspan x="446.33" y="384">effortless</tspan><tspan class="cls-2" x="644.26" y="384"> </tspan><tspan x="674.28" y="384">that,</tspan><tspan class="cls-17" x="773.24" y="384"> </tspan><tspan x="803.26" y="384">over</tspan><tspan class="cls-2" x="882.43" y="384"> </tspan><tspan x="912.45" y="384">time,</tspan><tspan class="cls-2" x="1011.42" y="384"> </tspan><tspan x="1041.43" y="384">we</tspan><tspan class="cls-2" x="1081.02" y="384"> </tspan><tspan x="1111.04" y="384">forgot</tspan><tspan class="cls-2" x="1229.8" y="384"> </tspan><tspan x="1259.81" y="384">that </tspan></tspan><tspan class="cls-8"><tspan x="0" y="432">thinking for ourselves was our right all along.</tspan></tspan><tspan class="cls-8"><tspan x="0" y="528">But remember—</tspan></tspan><tspan class="cls-8"><tspan x="0" y="624">Technology</tspan><tspan class="cls-18" x="197.93" y="624"> </tspan><tspan x="217.09" y="624">may</tspan><tspan class="cls-14" x="276.47" y="624"> </tspan><tspan class="cls-7" x="295.63" y="624">decide</tspan><tspan class="cls-14" x="414.39" y="624"> </tspan><tspan x="433.55" y="624">what</tspan><tspan class="cls-14" x="512.73" y="624"> </tspan><tspan x="531.89" y="624">we</tspan><tspan class="cls-15" x="571.47" y="624"> </tspan><tspan x="590.64" y="624">watch</tspan><tspan class="cls-14" x="689.6" y="624"> </tspan><tspan x="708.76" y="624">next,</tspan><tspan class="cls-15" x="807.73" y="624"> </tspan><tspan x="826.89" y="624">but</tspan><tspan class="cls-14" x="886.27" y="624"> </tspan><tspan x="905.43" y="624">it</tspan><tspan class="cls-14" x="945.02" y="624"> </tspan><tspan x="964.18" y="624">should</tspan><tspan class="cls-15" x="1082.94" y="624"> </tspan><tspan x="1102.1" y="624">never</tspan><tspan class="cls-14" x="1201.07" y="624"> </tspan><tspan x="1220.23" y="624">decide </tspan></tspan><tspan class="cls-8"><tspan x="0" y="672">how we live our lives.</tspan></tspan><tspan class="cls-12"><tspan x="0" y="768">After all, the choice has always been ours to make.</tspan></tspan></text>
