10.23" y="149.47"> </tspan><tspan x="518.12" y="149.47">physiological </tspan></tspan><tspan class="cls-3"><tspan x="0" y="168.16">and</tspan><tspan class="cls-30" x="25.68" y="168.16"> </tspan><tspan x="33.87" y="168.16">behavioral</tspan><tspan class="cls-30" x="119.48" y="168.16"> </tspan><tspan x="127.67" y="168.16">responses</tspan><tspan class="cls-30" x="204.71" y="168.16"> </tspan><tspan x="212.9" y="168.16">in</tspan><tspan class="cls-30" x="230.02" y="168.16"> </tspan><tspan x="238.21" y="168.16">the</tspan><tspan class="cls-30" x="263.9" y="168.16"> </tspan><tspan x="272.09" y="168.16">human</tspan><tspan class="cls-30" x="314.89" y="168.16"> </tspan><tspan x="323.08" y="168.16">body.</tspan><tspan class="cls-30" x="365.88" y="168.16"> </tspan><tspan x="374.07" y="168.16">It</tspan><tspan class="cls-30" x="391.19" y="168.16"> </tspan><tspan x="399.38" y="168.16">is</tspan><tspan class="cls-1" x="416.51" y="168.16"> </tspan><tspan x="424.7" y="168.16">recommended</tspan><tspan class="cls-30" x="518.86" y="168.16"> </tspan><tspan x="527.05" y="168.16">that</tspan><tspan class="cls-30" x="561.29" y="168.16"> </tspan><tspan x="569.48" y="168.16">further </tspan></tspan><tspan class="cls-3"><tspan x="0" y="186.84">isolation and testing analysis be conducted regarding these symptoms.</tspan></tspan></text>
