      <text class="cls-28" transform="translate(79.41 430.62)"><tspan class="cls-31"><tspan x="0" y="0">Based</tspan><tspan class="cls-34" x="42.8" y="0"> </tspan><tspan x="53.52" y="0">on</tspan><tspan class="cls-29" x="70.64" y="0"> </tspan><tspan x="81.37" y="0">the</tspan><tspan class="cls-34" x="107.05" y="0"> </tspan><tspan x="117.77" y="0">physical</tspan><tspan class="cls-29" x="186.25" y="0"> </tspan><tspan x="196.97" y="0">data</tspan><tspan class="cls-34" x="231.22" y="0"> </tspan><tspan x="241.94" y="0">analysis,</tspan><tspan class="cls-34" x="318.98" y="0"> </tspan><tspan x="329.7" y="0">the</tspan><tspan class="cls-29" x="355.38" y="0"> </tspan><tspan x="366.11" y="0">subject</tspan><tspan class="cls-34" x="426.03" y="0"> </tspan><tspan x="436.75" y="0">presents</tspan><tspan class="cls-34" x="505.24" y="0"> </tspan><tspan x="515.96" y="0">facial</tspan><tspan class="cls-29" x="567.32" y="0"> </tspan><tspan x="578.04" y="0">muscle </tspan></tspan><tspan class="cls-31"><tspan x="0" y="18.68">rigidity</tspan><tspan class="cls-34" x="68.48" y="18.68"> </tspan><tspan x="79.21" y="18.68">with</tspan><tspan class="cls-34" x="113.45" y="18.68"> </tspan><tspan x="124.17" y="18.68">an</tspan><tspan class="cls-29" x="141.29" y="18.68"> </tspan><tspan x="152.01" y="18.68">unnatural</tspan><tspan class="cls-34" x="229.06" y="18.68"> </tspan><tspan x="239.78" y="18.68">smile,</tspan><tspan class="cls-34" x="291.14" y="18.68"> </tspan><tspan x="301.86" y="18.68">dry</tspan><tspan class="cls-34" x="327.54" y="18.68"> </tspan><tspan x="338.26" y="18.68">cracked</tspan><tspan class="cls-34" x="398.19" y="18.68"> </tspan><tspan x="408.91" y="18.68">lips,</tspan><tspan class="cls-34" x="451.71" y="18.68"> </tspan><tspan x="462.43" y="18.68">unfocused</tspan><tspan class="cls-29" x="539.48" y="18.68"> </tspan><tspan x="550.2" y="18.68">eyes</tspan><tspan class="cls-34" x="584.44" y="18.68"> </tspan><tspan x="595.16" y="18.68">with </tspan></tspan><tspan class="cls-31"><tspan x="0" y="37.37">involuntary</tspan><tspan class="cls-37" x="94.17" y="37.37"> </tspan><tspan x="101.32" y="37.37">movements,</tspan><tspan class="cls-37" x="186.93" y="37.37"> </tspan><tspan x="194.08" y="37.37">severe</tspan><tspan class="cls-37" x="245.45" y="37.37"> </tspan><tspan x="252.6" y="37.37">dark</tspan><tspan class="cls-37" x="286.85" y="37.37"> </tspan><tspan x="294" y="37.37">circles,</tspan><tspan class="cls-37" x="362.49" y="37.37"> </tspan><tspan x="369.64" y="37.37">and</tspan><tspan class="cls-37" x="395.32" y="37.37"> </tspan><tspan x="402.48" y="37.37">an</tspan><tspan class="cls-37" x="419.6" y="37.37"> </tspan><tspan x="426.76" y="37.37">irregular</tspan><tspan class="cls-37" x="503.8" y="37.37"> </tspan><tspan x="510.96" y="37.37">heartbeat.</tspan><tspan class="cls-37" x="596.56" y="37.37"> </tspan><tspan x="603.72" y="37.37">The </tspan></tspan><tspan class="cls-31"><tspan x="0" y="56.05">metric</tspan><tspan class="cls-6" x="51.36" y="56.05"> </tspan><tspan x="62.44" y="56.05">scores</tspan><tspan class="cls-27" x="113.8" y="56.05"> </tspan><tspan x="124.88" y="56.05">for</tspan><tspan class="cls-6" x="150.56" y="56.05"> </tspan><tspan x="161.63" y="56.05">the</tspan><tspan class="cls-27" x="187.31" y="56.05"> </tspan><tspan x="198.39" y="56.05">eyes,</tspan><tspan class="cls-6" x="241.19" y="56.05"> </tspan><tspan x="252.27" y="56.05">under-eye</tspan><tspan class="cls-27" x="329.31" y="56.05"> </tspan><tspan x="340.39" y="56.05">area,</tspan><tspan class="cls-6" x="383.19" y="56.05"> </tspan><tspan x="394.26" y="56.05">and</tspan><tspan class="cls-27" x="419.95" y="56.05"> </tspan><tspan x="431.02" y="56.05">lips</tspan><tspan class="cls-6" x="465.26" y="56.05"> </tspan><tspan x="476.34" y="56.05">are</tspan><tspan class="cls-27" x="502.02" y="56.05"> </tspan><tspan x="513.09" y="56.05">all</tspan><tspan class="cls-6" x="538.77" y="56.05"> </tspan><tspan x="549.85" y="56.05">below</tspan><tspan class="cls-6" x="592.65" y="56.05"> </tspan><tspan x="603.73" y="56.05">50, </tspan></tspan><tspan class="cls-31"><tspan x="0" y="74.74">falling significantly below the average.</tspan></tspan><tspan class="cls-16" x="0" y="112.11">The</tspan><tspan class="cls-17" x="25.68" y="112.11"> </tspan><tspan class="cls-16" x="38.12" y="112.11">overall</tspan><tspan class="cls-15" x="98.04" y="112.11"> </tspan><tspan class="cls-16" x="110.47" y="112.11">health</tspan><tspan class="cls-17" x="161.83" y="112.11"> </tspan><tspan class="cls-16" x="174.27" y="112.11">score</tspan><tspan class="cls-15" x="217.07" y="112.11"> </tspan><tspan class="cls-16" x="229.5" y="112.11">is</tspan><tspan class="cls-17" x="246.62" y="112.11"> </tspan><tspan class="cls-16" x="259.06" y="112.11">rated</tspan><tspan class="cls-15" x="301.86" y="112.11"> </tspan><tspan class="cls-16" x="314.29" y="112.11">as</tspan><tspan class="cls-17" x="331.42" y="112.11"> </tspan><tspan class="cls-16" x="343.85" y="112.11">&quot;</tspan><tspan class="cls-30" x="352.41" y="112.11">Severe</tspan><tspan class="cls-16" x="403.77" y="112.11">&quot;</tspan><tspan class="cls-17" x="412.33" y="112.11"> </tspan><tspan class="cls-16" x="424.77" y="112.11">(Red</tspan><tspan class="cls-15" x="459.01" y="112.11"> </tspan><tspan class="cls-16" x="471.44" y="112.11">Alert),</tspan><tspan class="cls-17" x="531.37" y="112.11"> </tspan><tspan class="cls-16" x="543.8" y="112.11">indicating </tspan><tspan class="cls-16"><tspan x="0" y="130.79">substantial</tspan><tspan class="cls-3" x="94.17" y="130.79"> </tspan><tspan x="109.71" y="130.79">harm</tspan><tspan class="cls-3" x="143.95" y="130.79"> </tspan><tspan x="159.49" y="130.79">to</tspan><tspan class="cls-33" x="176.61" y="130.79"> </tspan><tspan x="192.15" y="130.79">the</tspan><tspan class="cls-3" x="217.83" y="130.79"> </tspan><tspan x="233.38" y="130.79">body.</tspan><tspan class="cls-3" x="276.18" y="130.79"> </tspan><tspan x="291.72" y="130.79">These</tspan><tspan class="cls-3" x="334.52" y="130.79"> </tspan><tspan x="350.06" y="130.79">multiple</tspan><tspan class="cls-33" x="418.55" y="130.79"> </tspan><tspan x="434.09" y="130.79">abnormal</tspan><tspan class="cls-3" x="502.57" y="130.79"> </tspan><tspan x="518.12" y="130.79">physiological </tspan></tspan><tspan class="cls-16"><tspan x="0" y="149.47">indicators</tspan><tspan class="cls-5" x="85.61" y="149.47"> </tspan><tspan x="107.04" y="149.47">and</tspan><tspan class="cls-32" x="132.72" y="149.47"> </tspan><tspan x="154.15" y="149.47">the</tspan><tspan class="cls-5" x="179.83" y="149.47"> </tspan><tspan x="201.26" y="149.47">cardiovascular</tspan><tspan class="cls-32" x="321.11" y="149.47"> </tspan><tspan x="342.54" y="149.47">rhythm</tspan><tspan class="cls-5" x="393.9" y="149.47"> </tspan><tspan x="415.33" y="149.47">anomaly</tspan><tspan class="cls-32" x="475.25" y="149.47"> </tspan><tspan x="496.68" y="149.47">require</tspan><tspan class="cls-5" x="556.61" y="149.47"> </tspan><tspan x="578.04" y="149.47">urgent </tspan></tspan><tspan class="cls-16"><tspan x="0" y="168.16">intervention.</tspan></tspan></text>
