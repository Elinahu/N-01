      <text transform="translate(490.18 1353.28)">
        <tspan class="cls-26">
          <tspan class="cls-14" x="0" y="0">【</tspan>
          <tspan class="cls-22" x="14.63" y="0">Experimental Observation Summary</tspan>
          <tspan class="cls-14" x="272.07" y="0">】</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="35.12">Environmental Setup:</tspan>
          <tspan class="cls-33" x="223.8" y="35.12" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-50.46" y="51.08">An enclosed observation room with multiple electronic </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-57.77" y="67.04">displays. Lighting was dimmed to emphasize screen glow, </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-13.89" y="83">with the subject placed facing the screens.</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="116.52">Observation Results:</tspan>
          <tspan class="cls-33" x="223.8" y="116.52" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-54.11" y="132.48">The subject immediately showed extreme interest in the </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-68.74" y="148.44">screens. With eyes fixated and fully absorbed, the subject </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-68.74" y="164.4">exhibited a strong attentional bias. This indicates severe </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-43.14" y="180.37">visual dependence and psychological addiction, with </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-28.52" y="196.33">attention completely captivated by the screens.</tspan>
        </tspan>
      </text>
    </g>
