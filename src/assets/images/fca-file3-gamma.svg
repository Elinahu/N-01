      <text transform="translate(1589.13 1338.48)">
        <tspan class="cls-26">
          <tspan class="cls-14" x="0" y="0">【</tspan>
          <tspan class="cls-22" x="14.63" y="0">Experimental Observation Summary</tspan>
          <tspan class="cls-14" x="272.07" y="0">】</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="35.12">Environmental Setup:</tspan>
          <tspan class="cls-33" x="223.8" y="35.12" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-57.77" y="51.08">An enclosed laboratory equipped with various electronic </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-57.77" y="67.04">devices. Standard living conditions are maintained, but </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-68.74" y="83">subjects are free to use the devices and control their own </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-17.55" y="98.96">sleep schedules without forced intervention.</tspan>
        </tspan>
        <tspan class="cls-26">
          <tspan class="cls-23" x="62.9" y="132.48">Observation Results:</tspan>
          <tspan class="cls-33" x="223.8" y="132.48" />
        </tspan>
        <tspan class="cls-34">
          <tspan x="-61.42" y="148.44">The subject exhibits severe circadian rhythm disruption. </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-72.39" y="164.4">Average sleep duration is drastically reduced to 2-3 hours, </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-65.08" y="180.37">accompanied by significant loss of appetite. This extreme </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-54.11" y="196.33">sleep deprivation and eating disorder indicate a rapid </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="-46.8" y="212.29">decline in basic physiological functions within this </tspan>
        </tspan>
        <tspan class="cls-34">
          <tspan x="99.46" y="228.25">environment.</tspan>
        </tspan>
      </text>
    </g>
